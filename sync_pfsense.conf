# sync_pfsense.conf — Configuration for sync_pfsense.py
# Keep this file outside version control (contains paths to SSH keys).

[pfsense]
# pfSense hostname or IP address
host = 192.168.1.1

# SSH port (pfSense default is 22)
port = 22

# SSH username (typically 'admin')
user = admin

# Absolute path to the SSH private key on the host running the cron job.
# Generate with: ssh-keygen -t ed25519 -f ~/.ssh/pfsense_mc_sync -C "mc_sync"
# Then add the public key in pfSense: System > User Manager > your user > Authorized SSH Keys
ssh_key = /root/.ssh/pfsense_mc_sync

# (Optional but recommended) Path to SSH known_hosts file.
# Without this the script uses TOFU (Trust On First Use) on first connection.
# Populate with: ssh-keyscan -p 22 192.168.1.1 >> /root/.ssh/pfsense_known_hosts
# known_hosts = /root/.ssh/pfsense_known_hosts

# Name of the pfSense firewall alias to update (must already exist in pfSense)
alias_name = MinecraftAllows

# (Optional) Temporary PHP script path on pfSense — cleaned up after each run
# remote_tmp = /tmp/.mc_alias_sync.php

[data]
# Absolute path to players.json ON THE DOCKER HOST (the volume-mounted side).
# Example: if docker-compose maps  - /opt/minecraft/logs:/app/logs
# then set:
json_path = /opt/minecraft/logs/players.json
