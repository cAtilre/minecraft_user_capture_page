<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player Name</title>
</head>
<body>
  <h2>Enter Player Name</h2>

  <form method="POST" action="/submit">
    <div>
      <label for="playerName">Player Name:</label>
      <input
        type="text"
        id="playerName"
        name="playerName"
        placeholder="Player name"
        required
      />
      <p style="margin-top: 5px; font-size: 0.9em;">Username must match: <code>^[a-zA-Z0-9_]{2,16}$</code></p>
    </div>

    <div style="margin-top: 20px;">
      <label for="myIP">My IP:</label>
      <input
        type="text"
        id="myIP"
        name="myIP"
        placeholder="Detecting your IP…"
      />
      <p style="margin-top: 5px; font-size: 0.9em;" id="ipNote">Fetching your public IP address…</p>
    </div>

    <button type="submit" style="margin-top: 20px;">Submit</button>
  </form>

  <script>
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        const field = document.getElementById("myIP");
        const note = document.getElementById("ipNote");
        field.value = data.ip;
        note.textContent = "Your public IP address has been pre-filled. You may correct it if needed.";
      })
      .catch(() => {
        const note = document.getElementById("ipNote");
        note.textContent = "Could not detect your IP automatically. Please enter it manually.";
      });
  </script>
</body>
</html>
